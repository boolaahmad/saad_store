<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>سعد ستور | Saad Store - صيانة وتصليح الهواتف الذكية</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800&display=swap" rel="stylesheet">
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        brand: {
                            blue: '#1e3a8a',
                            lightBlue: '#3b82f6',
                            accent: '#f59e0b',
                            darkBg: '#0f172a',
                            darkCard: '#1e293b'
                        }
                    },
                    fontFamily: {
                        tajawal: ['Tajawal', 'sans-serif']
                    }
                }
            }
        }
    </script>
    <style>
        body { font-family: 'Tajawal', sans-serif; }
        .glass { background: rgba(255, 255, 255, 0.85); backdrop-filter: blur(10px); }
        .dark .glass { background: rgba(30, 41, 59, 0.85); backdrop-filter: blur(10px); }
    </style>
</head>
<body class="bg-gray-50 text-gray-800 dark:bg-brand-darkBg dark:text-gray-100 transition-colors duration-300 min-h-screen flex flex-col justify-between">

    <!-- Header / Navbar -->
    <header class="sticky top-0 z-40 glass border-b border-gray-200 dark:border-gray-800 shadow-sm">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-20 flex items-center justify-between">
            <!-- Logo -->
            <div class="flex items-center space-x-3 space-x-reverse">
                <div class="w-12 h-12 rounded-xl bg-gradient-to-tr from-blue-700 to-amber-500 flex items-center justify-center text-white shadow-lg text-2xl font-extrabold">
                    S
                </div>
                <div>
                    <h1 class="text-2xl font-extrabold tracking-tight text-blue-900 dark:text-blue-400">سعد ستور</h1>
                    <p class="text-xs text-amber-600 dark:text-amber-400 font-bold">Saad Store - صيانة واحترافية</p>
                </div>
            </div>

            <!-- Navigation & Actions -->
            <div class="flex items-center gap-3">
                <button id="themeToggleBtn" onclick="toggleDarkMode()" class="p-2.5 rounded-xl bg-gray-100 dark:bg-gray-800 text-gray-600 dark:text-gray-300 hover:bg-gray-200 dark:hover:bg-gray-700 transition">
                    <i id="themeIcon" class="fas fa-moon text-lg"></i>
                </button>
                <button onclick="openAdminModal()" class="px-3 py-2 rounded-xl bg-amber-500 hover:bg-amber-600 text-white font-bold text-sm shadow transition flex items-center gap-1.5">
                    <i class="fas fa-lock text-xs"></i>
                    <span>لوحة الإدارة</span>
                </button>
            </div>
        </div>
    </header>

    <!-- Main Container -->
    <main class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-8 space-y-12 flex-grow">

        <!-- Hero Section -->
        <section class="relative rounded-3xl bg-gradient-to-r from-blue-900 via-blue-800 to-indigo-900 text-white p-8 md:p-12 overflow-hidden shadow-2xl">
            <div class="relative z-10 max-w-2xl space-y-4">
                <span class="bg-amber-500/20 text-amber-300 border border-amber-500/30 text-xs px-3 py-1 rounded-full font-bold">مركز صيانة معتمد وخبرة سنوات</span>
                <h2 class="text-3xl md:text-5xl font-black leading-tight">صلح تليفونك وأنت مطمن مع Saad Store</h2>
                <p class="text-gray-200 text-sm md:text-base">نوفر قطع غيار أصلية، ضمان على الصيانة، وسرعة في التسليم بنفس اليوم مع إمكانية متابعة حالة جهازك أونلاين.</p>
                <div class="pt-4 flex flex-wrap gap-3">
                    <a href="#calculator" class="bg-amber-500 hover:bg-amber-600 text-gray-900 font-extrabold px-6 py-3 rounded-xl shadow-lg transition">احسب تكلفة صيانة جهازك</a>
                    <a href="#tracking" class="bg-white/10 hover:bg-white/20 text-white border border-white/20 font-bold px-6 py-3 rounded-xl backdrop-blur-sm transition">تتبع حالة جهازك</a>
                </div>
            </div>
        </section>

        <!-- Status Tracking Section -->
        <section id="tracking" class="bg-white dark:bg-brand-darkCard p-6 md:p-8 rounded-3xl shadow-xl border border-gray-100 dark:border-gray-800">
            <div class="max-w-xl mx-auto text-center space-y-4">
                <div class="w-16 h-16 bg-blue-100 dark:bg-blue-900/40 text-blue-600 dark:text-blue-400 rounded-2xl flex items-center justify-center mx-auto text-2xl">
                    <i class="fas fa-search"></i>
                </div>
                <h3 class="text-2xl font-bold">تتبع حالة جهازك بالم
